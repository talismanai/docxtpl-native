[package]
name = "docxtpl-core-external-consumer"
version = "0.1.0"
edition = "2024"
publish = false

# A separate workspace proves Cargo does not inherit the main workspace patch.
[workspace]

[dependencies]
docxtpl-core = { path = "../.." }
zip = { version = "=2.6.1", default-features = false, features = ["deflate-flate2", "flate2"] }

[patch.crates-io]
# Consumers outside the project must explicitly select this audited fork.
minijinja = { path = "../../../../vendor/minijinja" }
zlib-rs = { path = "../../../../vendor/zlib-rs" }
