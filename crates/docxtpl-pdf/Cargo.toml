[package]
name = "docxtpl-pdf"
version.workspace = true
edition.workspace = true
# The PDF converter uses language features newer than the engine MSRV.
rust-version = "1.96"
license.workspace = true
repository.workspace = true
publish = false
description = "DOCX to PDF for hosts without a filesystem: fonts supplied by the host, on demand, and the page positions of a document's bookmarks"

[dependencies]
# Word-compatible layout. The fork adds what a browser needs: the wasm32
# build, fonts in memory, font requests and bookmark positions.
docxide-pdf = { git = "https://github.com/talismanai/docxide-pdf", rev = "a4a2a6f267c1bf255f0f5f72abef458b3009031d", default-features = false }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
# A minimal DOCX to convert.
docxtplrs = { path = "../../vendor/docxtplrs", default-features = false }
# Reads the PDF's compressed object streams back (the engine's own zlib).
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
