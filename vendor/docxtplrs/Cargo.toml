[package]
name = "docxtplrs"
version = "0.3.2"
edition = "2021"
description = "Rust implementation of python-docx-template (docxtpl): render docx templates with Jinja2 syntax (minijinja), native zip/XML handling, plus optional Python bindings via PyO3"
license = "LGPL-2.1-or-later"
repository = "https://github.com/yiyinzhang/docxtplrs"
homepage = "https://github.com/yiyinzhang/docxtplrs"
readme = "README.md"
keywords = ["docx", "template", "jinja2", "word", "office"]
categories = ["text-processing", "rendering", "parser-implementations"]
exclude = [
    ".venv/",
    ".pytest_cache/",
    "target/",
    "tests/",
    "python/",
    "main.py",
    "uv.lock",
    ".python-version",
    "__pycache__/",
]

[package.metadata.docs.rs]
features = ["python"]

[lib]
name = "docxtplrs"
# Upstream also builds a cdylib (its own Python extension). Cargo gives the
# outputs of a path crate with a cdylib target unhashed file names, so builds
# with different feature sets overwrote each other's `libdocxtplrs.rlib` and
# dependents failed with "multiple different versions of crate `minijinja`".
crate-type = ["rlib"]

[features]
# Upstream defaults to ["python"]. This fork is consumed as a Rust engine, so
# the PyO3 bridge is opt-in and a plain dependency never pulls Python in.
default = []
python = ["dep:pyo3"]
extension-module = ["python", "pyo3/extension-module"]

[profile.release]
lto = "fat"
codegen-units = 1

[dependencies]
pyo3 = { version = "0.29", optional = true }
minijinja = { version = "2", features = ["loader", "unicode", "json", "urlencode", "loop_controls"] }
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }
fancy-regex = "0.14"
quick-xml = "0.42"
crc32fast = "1"
sha1 = "0.10"
encoding_rs = "0.8"
memchr = "2"
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
aho-corasick = "1"
