[package]
name = "docxtpl-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Python binding (PyO3 extension module `docxtpl_native._native`) over the Rust DOCX templating engine"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
base64 = "=0.22.1"
corosensei = "=0.3.4"
scoped-tls = "=1.0.1"
scoped-tls-hkt = "=0.1.5"
libc = "=0.2.191"
docxtpl-core = { path = "../../crates/docxtpl-core" }
pyo3 = { version = "=0.29.0" }
minijinja = { version = "2.19", features = ["loader", "unicode", "json", "preserve_order", "unstable_machinery", "custom_syntax"] }
jinja = { git = "https://github.com/rsyi/jinja", rev = "52d077512af9b943b005ef374412ec96ee3a7a3d" }
docxtplrs = { path = "../../vendor/docxtplrs", default-features = false }
libxml = { git = "https://github.com/KWARC/rust-libxml", rev = "30e931c217998ee932a0b29c25849199a3dd1f83" }
serde_json = { version = "1", features = ["preserve_order"] }
zip = { version = "=2.6.1", default-features = false }

[build-dependencies]
pyo3-build-config = "=0.29.0"
